# Placé dans /data/nginx/custom/ du conteneur NPM. Voir docs/securite.md
# pour la procédure de copie (docker cp + nginx -s reload, à chaud).

# --- 1. Journal au format nginx standard, pour CrowdSec ----------------------
# NPM journalise dans un format maison ([Client x] [Sent-to y]) qu'aucun
# parseur CrowdSec ne sait lire. On ajoute un SECOND journal, sans toucher
# aux journaux existants.
log_format crowdsec '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

# --- 2. Fermer le serveur par défaut du port 80 ------------------------------
# Sans ce bloc, NPM sert sa page « Default Site », dont le titre et le contenu
# annoncent nginx et proxy manager — l'empreinte exacte du logiciel à cibler,
# servie à tout scanner. Le port 443 fait déjà mieux (ssl_reject_handshake +
# return 444 dans son default.conf) ; ceci aligne le 80.
#
# Les vhosts déclarés conservent leur redirection 301 vers HTTPS.
#
# ⚠️ Un seul default_server par adresse d'écoute. Si une version future de NPM
#    en déclare un, nginx refusera de démarrer sur un doublon.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}
