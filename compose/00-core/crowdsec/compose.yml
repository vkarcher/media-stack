name: crowdsec

# Détection d'intrusion sur les journaux du reverse proxy et de Jellyfin.
# Un service exposé reçoit des scans quotidiens dès le premier jour — ce n'est
# pas une hypothèse, c'est mesurable dans les journaux.

services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    container_name: crowdsec
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/base-http-scenarios crowdsecurity/http-cve LePresidente/jellyfin"
    volumes:
      - ${STACK_ROOT}/appdata/crowdsec/config:/etc/crowdsec
      - ${STACK_ROOT}/appdata/crowdsec/data:/var/lib/crowdsec/data
      # ⚠️ Les plugins de notification sont livrés en 999:1000 dans l'image,
      # or CrowdSec exige qu'ils appartiennent à root (protection contre
      # l'élévation de privilèges). Sans ce montage, le conteneur boucle sur
      #   "plugin at ... is not owned by user 'root'"
      # Préparer le dossier une fois :
      #   CID=$(docker create crowdsecurity/crowdsec:v1.7.8)
      #   docker cp "$CID:/usr/local/lib/crowdsec/plugins/." <cible>/
      #   docker rm "$CID"
      #   docker run --rm -v <cible>:/p alpine chown -R 0:0 /p
      - ${STACK_ROOT}/appdata/crowdsec/plugins:/usr/local/lib/crowdsec/plugins:ro
      - ${STACK_ROOT}/appdata/npm/data/logs:/var/log/npm:ro
      - ${STACK_ROOT}/appdata/jellyfin/log:/var/log/jellyfin:ro
      - ./acquis.yaml:/etc/crowdsec/acquis.d/npm.yaml:ro
      - ./acquis-jellyfin.yaml:/etc/crowdsec/acquis.d/jellyfin.yaml:ro
      # Sans ce fichier, TOUT bannissement notifie : plusieurs dizaines de
      # messages par jour, et on cesse de les lire. Voir docs/securite.md.
      - ./profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/whitelist-local.yaml:ro
    networks: [monitoring]
    expose: ["8080"]
    ports:
      # Le bouncer tourne en network_mode host (il pilote le pare-feu de la
      # machine) et ne peut donc pas résoudre « crowdsec ». On publie la LAPI
      # sur la boucle locale UNIQUEMENT — jamais joignable depuis le réseau.
      - "127.0.0.1:8090:8080"

networks:
  monitoring:
    external: true
