name: ntfy

# Notifications push auto-hébergées. Service PUBLIC → réseau dédié, isolé du
# reste de la supervision : une compromission de ntfy ne doit pas ouvrir l'accès
# aux autres outils.

services:
  ntfy:
    image: binwiederhier/ntfy:v2.26.3
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      TZ: ${TZ}
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ${STACK_ROOT}/appdata/ntfy:/var/lib/ntfy
    networks: [web-ntfy]
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/v1/health | grep -q true || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  web-ntfy:
    external: true
