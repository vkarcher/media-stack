name: prowlarr

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    restart: unless-stopped
    env_file: [../../../common.env]
    volumes:
      - ${STACK_ROOT}/appdata/prowlarr:/config
      - ../_scripts/notify-ntfy.sh:/scripts/notify-ntfy.sh:ro
      - ${STACK_ROOT}/secrets/ntfy-publisher.env:/run/secrets/ntfy.env:ro
    networks: [media]
    expose: ["9696"]

networks:
  media:
    external: true
