<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">media-stack</title>
  <desc id="d">Deux chemins, torrents/film.mkv et media/film.mkv, pointent vers un seul fichier sur le disque : un hardlink.</desc>
  <rect width="1200" height="300" rx="20" fill="#101418"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#243039"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="150" font-size="84" font-weight="700" fill="#e8edf2" letter-spacing="-2">media-stack</text>
    <text x="62" y="205" font-size="26" fill="#8a97a6">Jellyfin, *arr, VPN, CrowdSec, ntfy.</text>
    <text x="62" y="240" font-size="26" fill="#8a97a6">Docker Compose, versions épinglées.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <rect x="660" y="105" width="280" height="52" rx="10" fill="#17202a" stroke="#2c3a47"/>
    <text x="680" y="138" fill="#e8edf2">torrents/film.mkv</text>
    <rect x="660" y="185" width="280" height="52" rx="10" fill="#17202a" stroke="#2c3a47"/>
    <text x="680" y="218" fill="#e8edf2">media/film.mkv</text>

    <path d="M940 131 H975 V171 H1000 M940 211 H975 V171" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linejoin="round"/>

    <rect x="1000" y="116" width="160" height="110" rx="12" fill="#10281f" stroke="#3ddc97" stroke-width="2"/>
    <text x="1080" y="156" fill="#8a97a6" font-size="20" text-anchor="middle">inode 4821</text>
    <text x="1080" y="198" fill="#3ddc97" font-size="30" font-weight="700" text-anchor="middle">1 copie</text>
  </g>
  <text x="910" y="268" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8a97a6" text-anchor="middle">deux chemins, un seul fichier sur le disque</text>
</svg>
