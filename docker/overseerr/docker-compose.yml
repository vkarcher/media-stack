version: '3.8'
services:
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Paris
    volumes:
      - /volume1/docker/r-apps/overseerr/config:/config
    ports:
      - 5055:5055
    restart: unless-stopped
